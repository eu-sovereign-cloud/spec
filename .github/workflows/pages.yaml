on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "feature/doc-integration" ]
    #branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

name: Pages


# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy Docusaurus
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: docs/package-lock.json  # Ensure caching works for `docs/`

      - name: Install dependencies
        run: npm ci
        working-directory: docs  # Run inside `docs/`

      - name: Build Docusaurus
        run: npm run gen-api-docs all
        working-directory: docs  # Build inside `docs/`

      - name: Build Docusaurus
        run: npm run build
        working-directory: docs  # Build inside `docs/`

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build/  # Ensure correct upload path

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4