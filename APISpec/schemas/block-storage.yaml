BlockStorage:
  type: object
  description: |
    The Block Storage API manages two types of storage volumes:
    * Ephemeral Storage: Lifecycle bound to an instance. Can only be attached once and must be deleted after attached resource is deleted.
    * Persistent Storage: Independent lifecycle (can physically exist without instance attachment)
    The type of the storage is tight to the selected SKU.
  properties:
    apiVersion:
      type: string
      description: API version of the resource
      default: v1beta1
      readOnly: true
    kind:
      type: string
      description: Type of the resource
      enum: [ block-storage ]
      readOnly: true  
    metadata:
      $ref: './resource.yaml#/ZonalResourceMetadata'
    spec:
      type: object
      properties:
        profile:
          type: object
          properties:
            blockStorageSkuRef:
              type: string
              description: Reference to the SKU used for this block-storage
        sizeGB:
          type: integer
        origin:
          type: object
          properties:
            sourceImageRef:
              type: string
              readOnly: true
              description: Reference to the source image used as the base for creating this block storage. This cannot be modified.
    status:
      type: object
      readOnly: true
      properties:
        state:
          $ref: './resource.yaml#/ResourceState'
        sizeGB:
          type: integer
        attachedTo:
          $ref: './resource.yaml#/VolumeAttachment'
        conditions:
          $ref: "./resource.yaml#/StatusConditions"
