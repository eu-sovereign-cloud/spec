components:
  schemas:
    InstanceSku:
      description: |
        Represents a Stock Keeping Unit (SKU) for compute instances.
      allOf:
      - $ref: './resource.yaml#/components/schemas/SystemResourceMetadata'
      - type: object
        properties:
          metadata:
            $ref: './resource.yaml#/components/schemas/SkuResourceMetadata'
          spec:
            $ref: "./instance-sku.yaml#/components/schemas/InstanceSkuSpec"

    InstanceSkuSpec:
      type: object
      description: |
        Specification of the instance SKU, including its capabilities and extensions.
      required:
      - vCPU
      - ram
      - cpuArchitecture
      properties:
        vCPU:
          type: integer
          description: |
            The number of virtual CPUs (vCPUs) allocated to the instance SKU.
            This value represents the number of cores visible to the operating system.
            It does not specify the number of physical processors or hyper-threads available.
          minimum: 1
          maximum: 60
          example: 2
          x-oapi-codegen-extra-tags:
            x-kubebuilder-validation-minimum: "1"
            x-kubebuilder-validation-maximum: "60"
        ram:
          type: integer
          description: |
            The amount of RAM (Random Access Memory) allocated to the instance SKU in gigabytes.
            This value represents the total memory available to the instance.
          minimum: 1
          maximum: 65536
          example: 230
          x-oapi-codegen-extra-tags:
            x-kubebuilder-validation-minimum: "1"
            x-kubebuilder-validation-maximum: "65536"
        cpuArchitecture:
          type: string
          description: |
            CPU architecture provided by the instance SKU. An instance created with this
            SKU can only use images built for the same architecture.
          enum:
          - amd64
          - arm64
          - riscv
          x-enumNames:
          - InstanceSkuSpecCpuArchitectureAmd64
          - InstanceSkuSpecCpuArchitectureArm64
          - InstanceSkuSpecCpuArchitectureRiscv
          example: amd64
          x-oapi-codegen-extra-tags:
            x-kubebuilder-validation-enum: "amd64;arm64;riscv"
        gpu:
          allOf:
          - $ref: './instance-sku.yaml#/components/schemas/InstanceSkuGpuSpec'
          description: |
            GPU specification for this instance SKU. Omitted for instance SKUs
            without a GPU.

    InstanceSkuGpuSpec:
      type: object
      description: |
        Specification of the GPU(s) attached to an instance SKU.
      required:
      - count
      - vendor
      - model
      - ram
      properties:
        count:
          type: integer
          description: |
            The number of GPUs allocated to the instance SKU.
          minimum: 1
          maximum: 16
          example: 1
          x-oapi-codegen-extra-tags:
            x-kubebuilder-validation-minimum: "1"
            x-kubebuilder-validation-maximum: "16"
        vendor:
          type: string
          description: |
            The GPU vendor. An instance created with this SKU can only use images
            and drivers built for the same vendor.
          enum:
          - nvidia
          - amd
          - intel
          x-enumNames:
          - InstanceSkuGpuSpecVendorNvidia
          - InstanceSkuGpuSpecVendorAmd
          - InstanceSkuGpuSpecVendorIntel
          example: nvidia
          x-oapi-codegen-extra-tags:
            x-kubebuilder-validation-enum: "nvidia;amd;intel"
        model:
          type: string
          description: |
            The GPU model name, as reported by the vendor (e.g. "H100", "MI300X",
            "L40S"). Free-form, since GPU model names change frequently as new
            hardware is released, unlike vendor, which is a small, stable set.
          minLength: 1
          maxLength: 64
          example: "H100"
          x-oapi-codegen-extra-tags:
            x-kubebuilder-validation-min-length: "1"
            x-kubebuilder-validation-max-length: "64"
        ram:
          type: integer
          description: |
            The amount of dedicated video memory (VRAM) per GPU, in gigabytes.
          minimum: 1
          maximum: 256
          example: 80
          x-oapi-codegen-extra-tags:
            x-kubebuilder-validation-minimum: "1"
            x-kubebuilder-validation-maximum: "256"
      example:
        count: 1
        vendor: "nvidia"
        model: "H100"
        ram: 80
