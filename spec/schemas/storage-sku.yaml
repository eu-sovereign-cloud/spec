StorageSku:
  type: object
  description: |
    Represents a Stock Keeping Unit (SKU) for  storage resources.

    Storage SKUs define performance tiers for storage IOPS and characteristics.
    Properties, capabilities, and extensions can be found in the metadata.labels sections.
    Searchable with namespaces like "properties.", "capabilities.", and "extensions.".
  properties:    
    metadata:
      $ref: './resource.yaml#/RegionalResourceMetadata'
    spec:
      $ref: "./storage-sku.yaml#/StorageSkuSpec"

StorageSkuSpec:
  type: object
  description: |
    Specification of the storage SKU, including its capabilities and extensions.
  required:
  - description
  - iops
  - type
  - minVolumeSize
  properties:
    iops:
      type: integer
      description: |
        The number of IOPS (Input/Output Operations Per Second) guaranteed for
        the storage SKU.
    type:
      type: string
      description: |
        Type of storage SKU. Can be one of the following:

        * `local`: Local storage is directly attached to the hypervisor
          hosting the instance. In the event of a hypervisor failure, the data
          may either be lost or become unavailable until the hypervisor is
          restored. The failure mode depends on the Cloud Service Provider (CSP).
          Users of local storage should be aware of these risks and implement
          a robust backup strategy. Local storage is typically suited for
          high-performance workloads requiring low latency and high throughput,
          where the application layer can handle failures. It is not recommended
          for workloads demanding high availability or data durability.
        * `remote`: Remote storage is a network-attached storage solution
          designed to provide data redundancy and high availability. While
          typically slower than local storage, remote storage offers the
          advantage of being accessible by different hypervisors.
          This means the storage can be used by different instances running
          on separate hypervisors, but only one instance at a time. Remote
          storage cannot be attached to multiple instances simultaneously.
      enum:
        - local
        - remote
    description:
      type: string
    minVolumeSize:
      type: integer
      description: |
        Minimum volume size for guaranteed performance, in GB.
    extensions:
      type: array
      description: Additional storage feature extensions
      items:
        type: string
  example:
    iops: 100
    type: remote
    minVolumeSize: 50
    description: 'Very low-performance remote block storage tier'
