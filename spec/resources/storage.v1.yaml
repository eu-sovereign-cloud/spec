group: foundation
title: Storage
name: storage
version: v1
description: |
  The Storage Foundation API provides access to storage resources including 
  block storage and images.
  This API is part of the Sovereign European Cloud API.
resources:
  - name: sku
    plural: skus
    hierarchy: [tenant]
    schema: ./schemas/storage-sku.yaml#/StorageSku
    operations: [list, get]
    description:
      list: |
        Retrieves a list of available SKU (Stock Keeping Unit) configurations for block storage resources.

        ## Available SECA Block Storage SKUs with their capabilities

        Block Storage SKUs represent guaranteed IOPS performance for 99% of time within a 24h period.
        Minimum volume size for guaranteed performance is provider specific. Not all SKUs are available in 
        all regions and all CSP. Provides can provide additional SKUs with different performance 
        characteristics.

        | name | IOPS | description | type |
        |-|-|-|-|
        | seca.r100 | 100 IOPS    | Very low-performance remote block storage tier   | remote |
        | seca.r500 | 500 IOPS    | Low-performance remote block storage tier        | remote |
        | seca.r2k  | 2.0 IOPS    | Medium-performance remote block storage tier     | remote |
        | seca.r10k | 10.000 IOPS | High-performance remote block storage tier       | remote |
        | seca.r20k | 20.000 IOPS | Very high-performance remote block storage tier  | remote |
        | seca.l100 | 100 IOPS    | Very low-performance local block storage tier    | local |
        | seca.l500 | 500 IOPS    | Low-performance local block storage tier         | local |
        | seca.l5k  | 5.0 IOPS    | Medium-performance local block storage tier      | local |
        | seca.l20k | 20.000 IOPS | High-performance local block storage tier        | local |
        | seca.l40k | 40.000 IOPS | Very high-performance local block storage tier   | local |
    example:
      list:
        metadata:
          skipToken: "false"
          scope: "workspace/production"
          resource: "seca.compute/instances/my-server"
          verb: get  
        items:
        - { spec: { provider: 'SECA', tier: 'seca.general', description: 'a storage with no guaranteed throughput for normal usage' }}
        - { spec: { provider: 'SECA', tier: 'seca.100', description: 'minimal 100 iops, 99% of time, when >50GB' }}
        - { spec: { provider: 'SECA', tier: 'seca.250', description: 'minimal 250 iops, 99% of time, when >50GB' }}
        - { spec: { provider: 'SECA', tier: 'seca.500', description: 'minimal 500 iops, 99% of time, when >50GB' }}
  - name: image
    plural: images
    hierarchy: [tenant]
    schema: ./schemas/image.yaml#/Image
    operations: [list, get, put, delete]
    description:
      put:
        Creates or updates a image. The return code of the endpoint provides indicates if the resource was created or updated.
        A client must accept both as successful response to the request. Please check the [Image Handling](/docs/content/Other/image-handling) section
        before creating images.
  - name: block-storage
    plural: block-storages
    hierarchy: [tenant, workspace]
    schema: ./schemas/block-storage.yaml#/BlockStorage
    operations: [list, get, put, delete]
