group: foundation
title: Workspace
name: workspace
version: v1
description: |
  The Workspace API provides access to resources that are specific to a tenant's workspace.
  This API is part of the Sovereign European Cloud API.
resources:
  - name: workspace
    plural: workspaces
    hierarchy: [tenant]
    schema: ./schemas/workspace.yaml#/components/schemas/Workspace
    operations: [list, get, put, delete]
    description:
      delete: |
        Deletes the specified workspace.

        Deletion is not cascading. All child resources in the workspace must be
        deleted first. If the workspace still contains child resources, a `409`
        is returned.
